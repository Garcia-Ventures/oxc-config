name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Manifest mode: governed by release-please-config.json +
      # .release-please-manifest.json (no release-type input).
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Mint a short-lived OIDC token for npm trusted publishing.
      # No NODE_AUTH_TOKEN / NPM_TOKEN needed or allowed here.
      id-token: write
    steps:
      # Check out the exact tag release-please just created (e.g.
      # oxc-config-v1.1.1). Checking out the default ref can publish a
      # stale version on re-runs, which fails with "You cannot publish
      # over the previously published versions".
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Staged publishing requires npm >= 11.15.0.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Skip gracefully if this version is already on npm (e.g. a
      # re-run after a successful publish). Re-publishing fails with
      # "You cannot publish over the previously published versions".
      - name: Skip if version already published
        id: already_published
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Checking $PKG_NAME@$PKG_VERSION on npm..."
          if npm view "$PKG_NAME@$PKG_VERSION" version --silent >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$PKG_NAME@$PKG_VERSION is already published — skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "$PKG_NAME@$PKG_VERSION is not on npm — will publish."
          fi
      # Stage-only trusted publisher: CI submits to the stage queue;
      # a maintainer approves with 2FA before it goes live.
      - run: npm stage publish --access public
        if: steps.already_published.outputs.already != 'true'
