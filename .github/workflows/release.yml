name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Manifest mode: governed by release-please-config.json +
      # .release-please-manifest.json (no release-type input).
      - id: release
        uses: googleapis/release-please-action@v5

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Mint a short-lived OIDC token for npm trusted publishing.
      # No NODE_AUTH_TOKEN / NPM_TOKEN needed or allowed here.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing requires npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Provenance attestations are generated automatically via OIDC.
      - run: npm publish --provenance --access public
